# R-08: STRATEGY permitida por rango de VINTAGE
strategy_por_vintage:
  - vintage_min: 202401
    vintage_max: 202405
    strategies: ["14.Recalibration 1.0"]
  - vintage_min: 202406
    vintage_max: 202507
    strategies: ["15.Recalibration 2.0"]
  - vintage_min: 202508
    vintage_max: 202510
    strategies: ["r.Reca champ"]
  - vintage_min: 202511
    vintage_max: 202607
    strategies: ["r.Reca champ", "DARIA 1.6"]
  - vintage_min: 202608
    vintage_max: 202609
    strategies: ["r.Reca champ", "DARIA 2.0"]

# R-09: mezcla esperada (solo MOB 0, por ACCOUNTS), banda binomial 99%
mezcla_strategy:
  - vintage_min: 202511
    vintage_max: 202607
    challenger: "DARIA 1.6"
    p_esperada: 0.30
    confianza: 0.99
  - vintage_min: 202608
    vintage_max: 202609
    challenger: "DARIA 2.0"
    p_esperada: 0.50
    confianza: 0.99

familias:
  Reca:
    strategies:
      - "14.Recalibration 1.0"
      - "15.Recalibration 2.0"
      - "r.Reca champ"
    segmentos: STRATEGY_SEGMENT_RECA
    scores: SCORE_TAG_RECA
  DARIA:
    strategies:
      - "DARIA 1.6"
      - "DARIA 2.0"
    segmentos: STRATEGY_SEGMENT_DARIA
    scores: SCORE_TAG_DARIA

