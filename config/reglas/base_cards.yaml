# Catálogo de reglas y catálogos del cubo Base Cards (Manual §2.6.3).
# Los valores de STRATEGY_SEGMENT / SCORE_TAG se alinean al diccionario;
# se pueden regenerar cuando el banco confirme el CSV oficial.

corte_default: 202609
muestra_filas: 20
tolerancia_absoluta_montos: 0.01
tolerancia_relativa_reexpresion: 1.0e-6
mad_z_umbral: 3.5
metricas_rango_max: 99999999999999

