[project]
name = "basecards"
version = "0.1.0"
description = "Plataforma de IA para Data Science — cubo Base Cards"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
