  STRATEGY:
    - "14.Recalibration 1.0"
    - "15.Recalibration 2.0"
    - "r.Reca champ"
    - "DARIA 1.6"
    - "DARIA 2.0"

  # Familia Recalibration (7 segmentos). Incluye ejemplos del PRD/Manual.
  STRATEGY_SEGMENT_RECA:
    - "Young < 25"
    - "Young 25-30"
    - "Mature >30"
    - "Brands-NonPayroll-OffUs&LE"
    - "AAC Off Us Non-Payroll"
    - "Payroll Core"
    - "Mass Affluent"

  # Familia DARIA (17 segmentos).
  STRATEGY_SEGMENT_DARIA:
    - "LE Thin"
    - "LE Thick"
    - "NTC"
    - "Thin File"
    - "Thick File"
    - "Payroll"
    - "Non-Payroll"
    - "Brands Core"
    - "Brands Premium"
    - "Costco Core"
    - "Home Depot Core"
    - "Digital First"
    - "Branch First"
    - "Revolver Low"
    - "Revolver High"
    - "Transactor"
    - "New To Bank"

  SCORE_TAG_RECA:
    - "a.120-139"
    - "b.140-149"
    - "c.150-159"
    - "d.160-164"
    - "e.165-169"
    - "f.170-174"
    - "g.175-179"
    - "h.180+"

  SCORE_TAG_DARIA:
