[project]
name = "basecards"
version = "0.1.0"
description = "Plataforma de IA para Data Science — cubo Base Cards"
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.2.21",
    "langchain-core==1.8.0",
    "langchain-ollama==1.1.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "duckdb==2.0.0",
    "pandera==0.36.0",
    "scikit-learn==1.7.2",
    "lightgbm==4.7.0",
    "mlflow==3.18.0",
    "lxml==6.1.3",
    "python-pptx==1.0.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "xlsxwriter==3.3.1",
    "reportlab==5.1.0",
    "pypdf==7.1.0",
    "matplotlib==3.11.2",
    "jinja2==3.1.6",
    "markdown==3.11.3",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
